<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot des maints effets</title>
    <link rel="icon" href="cards/back.jpg">
    <script src="cards.js" defer></script>
    <script src="script.js" defer></script>
    <style>
        section {
            display: flex;
        }
        button {
            flex: 1;
            margin: 5px;
            background-color: transparent;
            border: none;
            padding: 0px;
        }
        img {
            width: 100%;
            transition: transform 0.2s ease;
            border-radius: 10px;
            color: white;
        }
        img:hover {
            transform: scale(1.1);
            position: relative;
            z-index: 1000;
        }
        .card {
            cursor: pointer;
        }
        body {
            /*background-image: url(cards/.png);*/
            background-attachment: fixed;
            background-size: cover;
        }
        #melanger {
            background-color: purple;
            color: yellow;
            border: 2px solid yellow;
            border-radius: 5px;
            text-decoration: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
        }
        #melanger:hover {
            background-color: yellow;
            color: purple;
            border: 2px solid purple;
        }
    </style>
</head>
